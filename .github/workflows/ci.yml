name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The GUI is its own workspace with its own Cargo.lock, and CI never builds it, so a new
      # engine dependency can leave that lock stale. Resolving it --locked fails if it is.
      - name: GUI lock up to date
        if: matrix.os == 'ubuntu-latest'
        run: cargo metadata --locked --format-version 1 --manifest-path crates/gui/Cargo.toml > /dev/null
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p cold-lava
      # The Linux binary, to try a PR without compiling it:
      # gh run download RUN_ID -n cold-lava-linux -D DIR (gh pr checks shows the run).
      - name: Upload the binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cold-lava-linux
          path: target/release/cold-lava
          retention-days: 3
          if-no-files-found: error

  release-check:
    # A PR that bumps the version must also add its CHANGELOG.md section (see RELEASING in README).
    name: release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/release-check.sh
