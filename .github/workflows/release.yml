name: Release

# Releases happen on their own: when main gets a commit whose Cargo.toml version has no tag yet,
# this checks it's ready (scripts/release-check.sh), runs the tests, builds the binaries, creates
# the vX.Y.Z tag on that commit and publishes the GitHub Release, with that version's
# CHANGELOG.md section as its notes. Pushing a vX.Y.Z tag by hand still works too.
#
# (A tag created by a workflow doesn't start other workflows, so this one does the whole release.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: scripts/release-check.sh
      - if: steps.check.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.release == 'true'
        name: Test
        run: cargo test --workspace --locked

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p cold-lava --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="cold-lava-v${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/cold-lava" README.md LICENSE CHANGELOG.md "$name/"
          cp -r example-vault "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cold-lava-*.tar.gz*

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.plan.outputs.version }}" '
            /^## \[/ { p = index($0, "[" v "]") > 0; next }
            /^\[.*\]: / { next }
            p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      # Creates the tag on this commit if it doesn't exist yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.plan.outputs.version }}
          files: dist/*
          body_path: notes.md
