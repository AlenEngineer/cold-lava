name: items bench (temporary)

on:
  push:
    branches: [items-from-tree]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build main
        run: |
          git worktree add ../main origin/main
          cd ../main && cargo build --release -p cold-lava
          cp target/release/cold-lava "$HOME/cold-lava-main"
      - name: Build this branch
        run: |
          cargo build --release -p cold-lava
          cp target/release/cold-lava "$HOME/cold-lava-branch"
      - name: Items, agenda, table on 3,000 notes (main, then this branch)
        run: python3 scripts/bench-items.py --runs 11 "$HOME/cold-lava-main" "$HOME/cold-lava-branch"
      - name: Reading 3,000 notes' items (pulldown-cmark, the tree)
        run: COLD_LAVA_BENCH_WS="$HOME/.cache/cold-lava-bench/ws-3000" cargo test --release -p cold-lava-engine items_cost -- --ignored --nocapture
