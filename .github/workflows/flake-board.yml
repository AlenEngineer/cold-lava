# Temporary: how often board.drive fails, on main's scripts and on this branch's. Removed before merge.
name: flake board (temporary)

on:
  push:
    branches: [board-drive-flake-215]

jobs:
  measure:
    name: ${{ matrix.scripts }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scripts: [main, fix]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Main's drive scripts
        if: matrix.scripts == 'main'
        run: git checkout 929b07b6faf275db864ce8657f95f440bc0e065c -- crates/cold-lava/tests/drive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build once
        run: cargo test -p cold-lava --test drive --no-run
      # The one test alone never failed on main's scripts (0 of 100, and 0 of 120 with busy loops on
      # every core), so only the whole suite counts: 5 shards of 30 runs for each set of scripts.
      - name: The whole drive suite, 30 times
        run: |
          fails=0
          for i in $(seq 1 30); do
            cargo test -p cold-lava --test drive > out.txt 2>&1 || true
            if grep -q "the_whiteboard_moves_edits_and_merges_cards ... FAILED" out.txt; then
              fails=$((fails+1))
              echo "suite run $i: $(grep -m1 -o 'board.drive:[0-9]*: .*' out.txt)"
            fi
            if grep " ... FAILED" out.txt | grep -qv the_whiteboard_moves; then
              echo "suite run $i, another test failed:"
              grep " ... FAILED" out.txt | grep -v the_whiteboard_moves
              grep -m3 -E '\.drive:[0-9]+: |panicked at' out.txt || true
            fi
          done
          echo "SUITE ${{ matrix.scripts }} shard ${{ matrix.shard }}: the whiteboard test failed in $fails of 30 runs" | tee -a "$GITHUB_STEP_SUMMARY"
