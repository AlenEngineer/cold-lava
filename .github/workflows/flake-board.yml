# Temporary: how often board.drive fails, on main's scripts and on this branch's. Removed before merge.
name: flake board (temporary)

on:
  push:
    branches: [board-drive-flake-215]

jobs:
  measure:
    name: ${{ matrix.scripts }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scripts: [main, fix]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Main's drive scripts
        if: matrix.scripts == 'main'
        run: git checkout b48cff1dd8e595775d19d9ea20505d828512a429 -- crates/cold-lava/tests/drive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build once
        run: cargo test -p cold-lava --test drive --no-run
      - name: The whole drive suite, 30 times (as CI runs it, the other tests loading the machine)
        run: |
          fails=0
          for i in $(seq 1 30); do
            cargo test -p cold-lava --test drive > out.txt 2>&1 || true
            if grep -q "the_whiteboard_moves_edits_and_merges_cards ... FAILED" out.txt; then
              fails=$((fails+1))
              echo "suite run $i: $(grep -m1 'board.drive:[0-9]*: ' out.txt)"
            fi
            grep " ... FAILED" out.txt | grep -v the_whiteboard_moves | sed "s/^/suite run $i, another test: /" || true
          done
          echo "SUITE ${{ matrix.scripts }}: the whiteboard test failed in $fails of 30 runs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The one test alone, 100 times
        run: |
          fails=0
          for i in $(seq 1 100); do
            if ! cargo test -p cold-lava --test drive the_whiteboard_moves_edits_and_merges_cards > out.txt 2>&1; then
              fails=$((fails+1))
              echo "solo run $i: $(grep -m1 'board.drive:[0-9]*: ' out.txt)"
            fi
          done
          echo "SOLO ${{ matrix.scripts }}: failed $fails of 100 runs" | tee -a "$GITHUB_STEP_SUMMARY"
