# Temporary: how often board.drive fails, on main's scripts and on this branch's. Removed before merge.
name: flake board (temporary)

on:
  push:
    branches: [board-drive-flake-215]

jobs:
  measure:
    name: ${{ matrix.scripts }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scripts: [main, fix]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Main's drive scripts
        if: matrix.scripts == 'main'
        run: git checkout b48cff1dd8e595775d19d9ea20505d828512a429 -- crates/cold-lava/tests/drive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build once
        run: cargo test -p cold-lava --test drive --no-run
      # Unloaded, neither main's scripts nor the fix failed (0 of 30 suite runs, 0 of 100 alone), so
      # the machine is loaded here: busy loops on every core while the one test runs.
      - name: The one test under load, 60 times at each level
        run: |
          for per_core in 1 3; do
            hogs=$(( $(nproc) * per_core ))
            for h in $(seq 1 $hogs); do ( while :; do :; done ) & done
            fails=0
            : > lines.txt
            for i in $(seq 1 60); do
              if ! cargo test -p cold-lava --test drive the_whiteboard_moves_edits_and_merges_cards > out.txt 2>&1; then
                fails=$((fails+1))
                grep -m1 -o 'board.drive:[0-9]*: .*' out.txt >> lines.txt || echo "no drive line" >> lines.txt
              fi
            done
            kill $(jobs -p) || true
            wait || true
            echo "LOAD ${{ matrix.scripts }}, $hogs busy loops: failed $fails of 60 runs" | tee -a "$GITHUB_STEP_SUMMARY"
            sort lines.txt | uniq -c | sed "s/^/LOAD ${{ matrix.scripts }}, $hogs busy loops, where: /"
          done
