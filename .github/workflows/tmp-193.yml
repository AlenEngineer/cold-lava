# Temporary, for #193's second round: every test binary runs, so the tests written before
# their fixes all show as failing in one run. Removed before the PR is done.
name: tmp-193

on:
  push:
    branches: [gateway-delete-193]

env:
  CARGO_TERM_COLOR: always

jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
