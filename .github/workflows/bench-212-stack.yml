name: one parser bench (temporary, #212)

on:
  push:
    branches: [one-parser-212]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: A workspace of 3,000 notes, and one with a 5,000-line note
        run: |
          python3 -c "import runpy; print(runpy.run_path('scripts/bench-items.py')['generate'](3000))"
          mkdir -p "$HOME/long/.obsidian"
          python3 - <<'EOF'
          import os
          blocks = [
              "## Section *one* #topic\n\n",
              "A paragraph with [[Some Note|an alias]], a [link](other.md \"title\"), `code`, **strong\nover a line** and #tag.  \nIt goes on after a hard break. ^blk\n\n",
              "- [ ] A task [due:: 2026-11-12] 📅 2026-11-12\n  - [x] A sub-task ~~struck~~ ✅ 2026-11-01\n- A plain item with [[Link]] and ==marks==\n\n",
              "> [!note] A callout\n> with a line [[Inside]] and a footnote[^n]\n\n",
              "```rust\nfn main() {\n    println!(\"[[not a link]]\");\n}\n```\n\n",
              "| Name | Value |\n| --- | :-: |\n| [[A]] | *1* |\n| [[B]] | 2 \\| 3 |\n\n",
              "[^n]: The note.\n\n",
          ]
          out, lines, k = [], 0, 0
          while lines < 5000:
              out.append(blocks[k % len(blocks)])
              lines += blocks[k % len(blocks)].count("\n")
              k += 1
          out.append("The last line of the long note.\n")
          open(os.path.expanduser("~/long/Long Note.md"), "w").write("".join(out))
          EOF
          wc -l "$HOME/long/Long Note.md"
      - name: Build main, the first branch and this one
        run: |
          git worktree add ../main origin/main
          git worktree add ../first origin/tree-inlines-212
          for side in ../main ../first .; do
            (cd $side && cargo test --release -p cold-lava-engine --no-run 2>&1 | tail -1)
          done
          for side in ../main .; do
            (cd $side && cargo build --release -p cold-lava 2>&1 | tail -1)
          done
      - name: The scan, the items and a keystroke, each in turn
        run: |
          export COLD_LAVA_BENCH_WS="$HOME/.cache/cold-lava-bench/ws-3000"
          for round in 1 2 3; do
            for side in ../main ../first .; do
              echo "== round $round: $side ($(git -C $side rev-parse --short HEAD))"
              (cd $side && cargo test --release -p cold-lava-engine -- --ignored --nocapture read_cost items_cost keystroke 2>&1 | grep -v "^test \|^running\|^$\|Finished\|Running\|Doc-tests\|test result")
            done
          done
      - name: Every note into a Doc, pulldown-cmark against the tree
        run: |
          export COLD_LAVA_BENCH_WS="$HOME/.cache/cold-lava-bench/ws-3000"
          for round in 1 2 3; do
            cargo test --release -p cold-lava-engine -- --ignored --nocapture doc_cost 2>&1 | grep "doc_cost\|pulldown-cmark:\|the tree:"
          done
      - name: Items, agenda, table, tidy and rename on 3,000 notes, main's binary and this branch's
        run: python3 scripts/bench-items.py --runs 11 ../main/target/release/cold-lava target/release/cold-lava
      - name: Opening the 5,000-line note in the reader, main's binary and this branch's
        run: |
          cat > "$HOME/open.drive" <<'EOF'
          size 120x40
          env COLD_LAVA_EDITOR=none
          wait-for long
          keys p
          type long note
          wait-for 1 notes
          keys enter
          wait-for Long Note  reading
          keys G
          wait-for The last line of the long note.
          keys esc
          keys q
          exits 0
          EOF
          cd "$HOME"
          for round in 1 2 3 4 5 6 7; do
            for bin in "$GITHUB_WORKSPACE/../main/target/release/cold-lava" "$GITHUB_WORKSPACE/target/release/cold-lava"; do
              start=$(date +%s%N)
              "$bin" drive "$HOME/open.drive" -- long > /tmp/open.out 2>&1 || { echo "FAILED $bin"; tail -5 /tmp/open.out; }
              end=$(date +%s%N)
              echo "round $round: $("$bin" --version): $(( (end - start) / 1000000 )) ms"
            done
          done
