name: flake 338

on:
  push:
    branches: [fix-338-board-report-flake]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  loop:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: |
          cargo test -p cold-lava-engine --lib --no-run
          cargo test -p cold-lava --test drive --no-run
      - name: The rescan test, 20 runs
        run: |
          fails=0
          for i in $(seq 20); do
            if ! cargo test -q -p cold-lava-engine --lib core::bad_items::a_rescan_says_what_a_board_leaves_out_in_the_poll_that_reads_it -- --exact > out.txt 2>&1; then
              fails=$((fails+1)); echo "=== run $i failed"; cat out.txt
            fi
          done
          echo "RESCAN TEST: $fails of 20 failed" | tee -a summary.txt
      - name: Engine test alone, 50 runs
        env:
          COLD_LAVA_TRACE_338: "1"
        run: |
          fails=0
          for i in $(seq 50); do
            if ! cargo test -q -p cold-lava-engine --lib core::bad_items::a_board_says_when_it_leaves_nothing_out_any_more -- --exact > out.txt 2>&1; then
              fails=$((fails+1)); echo "=== run $i failed"; cat out.txt
            fi
          done
          echo "ENGINE ALONE: $fails of 50 failed" | tee -a summary.txt
      - name: Engine suite, 15 runs, counting the test
        env:
          COLD_LAVA_TRACE_338: "1"
        run: |
          fails=0; other=0
          for i in $(seq 15); do
            if ! cargo test -q -p cold-lava-engine --lib > out.txt 2>&1; then
              if grep -q "a_board_says_when_it_leaves_nothing_out_any_more' .*panicked\|a_board_says_when_it_leaves_nothing_out_any_more stdout" out.txt; then
                fails=$((fails+1))
              else
                other=$((other+1))
              fi
              echo "=== run $i failed"; sed -n '/^failures:/,$p' out.txt
            fi
          done
          echo "ENGINE SUITE: the test failed $fails of 15; other failures $other" | tee -a summary.txt
      - name: Drive test alone, 30 runs
        run: |
          fails=0
          for i in $(seq 30); do
            if ! cargo test -q -p cold-lava --test drive the_boards_line_is_said_again_after_an_owner_that_cant_read -- --exact > out.txt 2>&1; then
              fails=$((fails+1)); echo "=== run $i failed"; cat out.txt
            fi
          done
          echo "DRIVE ALONE: $fails of 30 failed" | tee -a summary.txt
      - name: Drive suite, 6 runs, counting the test
        run: |
          fails=0; other=0
          for i in $(seq 6); do
            if ! cargo test -q -p cold-lava --test drive > out.txt 2>&1; then
              if grep -q "the_boards_line_is_said_again_after_an_owner_that_cant_read stdout" out.txt; then
                fails=$((fails+1))
              else
                other=$((other+1))
              fi
              echo "=== run $i failed"; sed -n '/^failures:/,$p' out.txt
            fi
          done
          echo "DRIVE SUITE: the test failed $fails of 6; other failures $other" | tee -a summary.txt
      - name: Summary
        if: always()
        run: cat summary.txt || true
