name: reader from the tree, every test (temporary, #212)

on:
  push:
    branches: [reader-from-tree-212]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The engine's tests
        run: cargo test -p cold-lava-engine --no-fail-fast
      - name: Every other test, without stopping at the first failure
        if: always()
        run: cargo test --workspace --exclude cold-lava-engine --no-fail-fast
