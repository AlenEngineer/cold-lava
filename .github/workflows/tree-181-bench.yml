name: tree 181 bench (temporary)

on:
  push:
    branches: [tree-reference-links-marked-tags]
  workflow_dispatch:

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: always()
        run: cargo fmt --all --check
      - name: Clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Engine tests
        if: always()
        run: cargo test -p cold-lava-engine

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build main
        run: |
          git worktree add ../main origin/main
          cd ../main && cargo build --release -p cold-lava
          cp target/release/cold-lava "$HOME/cold-lava-main"
      - name: Build this branch
        run: |
          cargo build --release -p cold-lava
          cp target/release/cold-lava "$HOME/cold-lava-branch"
      - name: Items, agenda, table on 3,000 notes (main, then this branch)
        run: python3 scripts/bench-items.py --runs 11 "$HOME/cold-lava-main" "$HOME/cold-lava-branch"
      - name: Build the cost tests (main, this branch)
        run: |
          (cd ../main && cargo test --release -p cold-lava-engine --no-run)
          cargo test --release -p cold-lava-engine --no-run
      - name: Reading 3,000 notes, main and this branch in turns
        run: |
          export COLD_LAVA_BENCH_WS="$HOME/.cache/cold-lava-bench/ws-3000"
          for round in 1 2 3; do
            echo "== main, round $round"
            (cd ../main && cargo test --release -p cold-lava-engine read_cost -- --ignored --nocapture | grep -A6 'read_cost:')
            echo "== branch, round $round"
            cargo test --release -p cold-lava-engine read_cost -- --ignored --nocapture | grep -A6 'read_cost:'
          done
      - name: Items of 3,000 notes, main and this branch in turns
        run: |
          export COLD_LAVA_BENCH_WS="$HOME/.cache/cold-lava-bench/ws-3000"
          for round in 1 2 3; do
            echo "== main, round $round"
            (cd ../main && cargo test --release -p cold-lava-engine items_cost -- --ignored --nocapture | grep -A5 'items_cost:')
            echo "== branch, round $round"
            cargo test --release -p cold-lava-engine items_cost -- --ignored --nocapture | grep -A5 'items_cost:'
          done
      - name: "Ablation builds: the old tag pattern, no LinkLabel arm"
        run: |
          exe() { cargo test --release -p cold-lava-engine --no-run 2>&1 | grep -o 'target/release/deps/cold_lava_engine-[0-9a-f]*' | head -1; }
          (cd ../main && cp "$(exe)" "$HOME/t-main")
          cp "$(exe)" "$HOME/t-branch"
          sed -i 's/(\[\*_~=\]\*)#(/()#(/' crates/engine/src/markdown.rs
          grep -n 'MARKED_TAG: ' crates/engine/src/markdown.rs
          cp "$(exe)" "$HOME/t-oldtag"
          git checkout crates/engine/src/markdown.rs
          python3 - <<'PY'
          import re
          p = 'crates/engine/src/owner/markdown.rs'
          s = open(p).read()
          arm = re.search(r"        Step::Token\(Kind::LinkLabel, label, at\) => \{.*?\n        \}\n", s, re.S)
          assert arm
          open(p, 'w').write(s[:arm.start()] + s[arm.end():])
          PY
          cp "$(exe)" "$HOME/t-noarm"
          git checkout crates/engine/src/owner/markdown.rs
      - name: "Ablation: reading 3,000 notes, each build in turn"
        run: |
          export COLD_LAVA_BENCH_WS="$HOME/.cache/cold-lava-bench/ws-3000"
          for round in 1 2 3 4 5; do
            for b in main branch oldtag noarm; do
              echo "== $b, round $round"
              "$HOME/t-$b" read_cost --ignored --nocapture | grep -A5 'read_cost:'
            done
          done
      - name: "One keystroke in a 5,000-line note, each build in turn"
        run: |
          for round in 1 2 3 4 5; do
            for b in main branch; do
              echo "== $b, round $round"
              "$HOME/t-$b" keystroke --ignored --nocapture | grep 'keystroke:'
            done
          done
