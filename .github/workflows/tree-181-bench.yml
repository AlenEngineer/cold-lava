name: tree 181 bench (temporary)

on:
  push:
    branches: [tree-reference-links-marked-tags]
  workflow_dispatch:

jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: The bench workspace
        run: |
          cargo build --release -p cold-lava
          python3 scripts/bench-items.py --runs 1 target/release/cold-lava
      - name: "Build the cost tests: main, main with code that is never run, this branch"
        run: |
          git worktree add ../main origin/main
          exe() { cargo test --release -p cold-lava-engine --no-run 2>&1 | grep -o 'target/release/deps/cold_lava_engine-[0-9a-f]*' | head -1; }
          # A function nothing calls, kept by the linker: the same work, placed elsewhere.
          pad() {
            printf '\n#[inline(never)]\npub fn placement_pad_%s(x: &[u8]) -> usize {\n    x.iter().map(|b| *b as usize * %s).sum()\n}\n\n#[used]\nstatic PLACEMENT_PAD_%s: fn(&[u8]) -> usize = placement_pad_%s;\n' "$2" "$3" "$2" "$2" >> "$1"
          }
          cp "$(exe)" "$HOME/t-branch"
          cd ../main
          cp "$(exe)" "$HOME/t-main"
          pad crates/engine/src/cst/block.rs a 31
          cp "$(exe)" "$HOME/t-main-pad1"
          pad crates/engine/src/cst/inline.rs b 37
          cp "$(exe)" "$HOME/t-main-pad2"
          pad crates/engine/src/owner/markdown.rs c 41
          pad crates/engine/src/cst.rs d 43
          cp "$(exe)" "$HOME/t-main-pad3"
          git diff --stat
      - name: Reading 3,000 notes, each build in turn
        run: |
          export COLD_LAVA_BENCH_WS="$HOME/.cache/cold-lava-bench/ws-3000"
          for round in 1 2 3 4 5; do
            for b in main main-pad1 main-pad2 main-pad3 branch; do
              echo "== $b, round $round"
              "$HOME/t-$b" read_cost --ignored --nocapture | grep -A5 'read_cost:'
            done
          done
