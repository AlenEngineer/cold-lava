[workspace]
members = ["crates/*"]
# The Tauri GUI is its own workspace: building it pulls in a webview, so `cargo build`, `cargo test`
# and CI here never compile it. Build it with `cargo build --manifest-path crates/gui/Cargo.toml`.
exclude = ["crates/gui"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AlenEngineer/cold-lava"

[workspace.dependencies]
cold-lava-engine = { path = "crates/engine" }
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1.1.10"
indexmap = { version = "2.14.2", features = ["serde"] }
notify = "8.2.1"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
toml = "1.2.0"
unicode-normalization = "0.1.26"
vt100 = "0.18.1"
walkdir = "2.5.0"
