[package]
name = "cold-lava"
version = "0.1.0"
edition = "2024"
description = "Obsidian's graph view and canvas, in the terminal"
license = "MIT"
repository = "https://github.com/AlenEngineer/cold-lava"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
notify = "8.2.1"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
toml = "1.2.0"
unicode-normalization = "0.1.26"
vt100 = "0.18.1"
walkdir = "2.5.0"
