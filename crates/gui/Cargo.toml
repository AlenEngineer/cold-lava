[package]
name = "cold-lava-gui"
description = "A graphical cold-lava, on Tauri: the same engine as the terminal UI"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AlenEngineer/cold-lava"
publish = false

# Its own workspace, so the main one never builds a webview (see the root Cargo.toml).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cold-lava-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
