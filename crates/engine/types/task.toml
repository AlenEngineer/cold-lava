# The task, as the Obsidian Tasks plugin writes it: a checkbox list item with its dates,
# recurrence and priority in the plugin's emoji format (`📅 2026-11-12`) or its Dataview format
# (`[due:: 2026-11-12]`). Built into cold-lava and written in the same language as anyone's types
# (docs/extensions.md, "Types"). `${tasks.…}` is the vault's Tasks plugin setting of that name.
version = 1

[types.task]
requires = ["task-lists"]
actions = ["tasks.toggle"]

[types.task.fields]
# The character between the brackets, and what the vault's statuses say it means.
status = "text"
status_type = { type = "enum", values = "${tasks.statuses}" }
# The words: the text without the checkbox, dates, recurrence, priority and global filter.
text = "text"
due = "date"
scheduled = "date"
start = "date"
created = "date"
done = "date"
cancelled = "date"
recurrence = "text"
priority = { type = "enum", values = { highest = "highest", high = "high", medium = "medium", low = "low", lowest = "lowest" } }
tags = "tag"
links = "link"
# The date of the daily note it is in.
daily_note = "date"

[[types.task.from]]
on = "list-item"
# A checkbox, a space and words; with a global filter, only lines that carry it.
match = '^\[[^\n]\]\s+.*${tasks.global-filter}'
# Its words, so ticking, re-dating or re-indenting it keeps its id. A checkbox with no words
# (`- [ ] 📅 2026-11-12`, a template's empty one) is no task yet.
key = ["text"]
required = ["text"]

[types.task.from.fields]
status = { checkbox = true }
status_type = { checkbox = true }
text = { rest = { without = ["${tasks.global-filter}"] } }
# Dataview's field first: when a line has both, it is the one that counts.
due = [{ inline = "due" }, { marker = "📅" }, { marker = "📆" }, { marker = "🗓" }]
scheduled = [{ inline = "scheduled" }, { marker = "⏳" }, { marker = "⌛" }]
start = [{ inline = "start" }, { marker = "🛫" }]
created = [{ inline = "created" }, { marker = "➕" }]
done = [{ inline = "completion" }, { marker = "✅" }]
cancelled = [{ inline = "cancelled" }, { marker = "❌" }]
recurrence = [{ inline = "repeat" }, { pattern = '🔁\x{FE0F}?\s*([a-zA-Z0-9, !]*[a-zA-Z0-9,!])' }]
# Of several priority glyphs, the lowest counts.
priority = [
    { flags = { "⏬" = "lowest", "🔽" = "low", "🔼" = "medium", "⏫" = "high", "🔺" = "highest" } },
    { inline = "priority" },
]
tags = { inlines = "tags" }
links = { inlines = "links" }
daily_note = { note = "date" }
