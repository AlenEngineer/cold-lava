# The task: an item with a checkbox, with its dates, recurrence and priority. Built into
# cold-lava and written in the same language as anyone's types (docs/extensions.md, "Types").
#
# It reads attributes, so it doesn't say how a file writes a checkbox or a due date: the owner
# of the file does. For Markdown that is `markdown/attributes.toml`, where the Obsidian Tasks
# plugin's emoji format (`📅 2026-11-12`), its Dataview format (`[due:: 2026-11-12]`) and its
# global filter live. `${tasks.statuses}` is the workspace's Tasks plugin setting.
version = 1

[types.task]
requires = ["task-lists"]
actions = ["tasks.toggle"]
# Over other list-item types, so a checkbox stays a task (and in the agenda) unless a type says
# it is one of its kind (`extends = "task"`, which starts at this priority too) or sets a higher
# priority.
priority = 1

[types.task.fields]
# The character between the brackets, and what the workspace's statuses say it means.
status = "text"
status_type = { type = "enum", values = "${tasks.statuses}" }
# The words: the text without the checkbox, dates, recurrence and priority.
text = "text"
due = "date"
scheduled = "date"
start = "date"
created = "date"
done = "date"
cancelled = "date"
recurrence = "text"
priority = { type = "enum", values = { highest = "highest", high = "high", medium = "medium", low = "low", lowest = "lowest" } }
tags = "tag"
links = "link"
# The date of the daily note it is in.
daily_note = "date"

[types.task.style]
# A finished task fades and is struck through, as Obsidian draws a ticked one.
status_type = { by-value = { done = { dim = true, strike = true, whole = true }, cancelled = { dim = true, strike = true, whole = true } } }
# The priority glyph on a chip coloured by how urgent it is.
priority = { badge = true, by-value = { highest = { colour = "red" }, high = { colour = "orange" }, medium = { colour = "yellow" }, low = { colour = "cyan" }, lowest = { colour = "muted" } } }

[[types.task.from]]
on = "item"
# An item its owner counts as a task. In Markdown: a checkbox, and with the Tasks plugin's
# global filter, the filter after it.
where.attribute = "task"
# Its words, so ticking, re-dating or re-indenting it keeps its id. A checkbox with no words
# (`- [ ] 📅 2026-11-12`, a template's empty one) is no task yet.
key = ["text"]
required = ["text"]

[types.task.from.fields]
status = { attribute = "checkbox" }
status_type = { attribute = "checkbox" }
text = { rest = true }
due = { attribute = "due" }
scheduled = { attribute = "scheduled" }
start = { attribute = "start" }
created = { attribute = "created" }
done = { attribute = "done" }
cancelled = { attribute = "cancelled" }
recurrence = { attribute = "recurrence" }
priority = { attribute = "priority" }
tags = { inlines = "tags" }
links = { inlines = "links" }
daily_note = { note = "date" }
