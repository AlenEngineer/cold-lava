[package]
name = "cold-lava-engine"
description = "The workspace engine behind cold-lava: notes, links, items and safe writes, with no user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
cold-lava-canvas.workspace = true
indexmap.workspace = true
notify.workspace = true
regex.workspace = true
rowan.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
toml = { workspace = true, features = ["preserve_order"] }
unicode-normalization.workspace = true
walkdir.workspace = true

[dev-dependencies]
# The oracle of two tests: the reader's `Doc` and the items as pulldown-cmark read them
# (markdown/pulldown.rs, items/pulldown.rs). Nothing the engine ships uses it.
pulldown-cmark.workspace = true
