name = "kanban-board"
title = "Kanban board"
version = "0.1.0"
description = "Shows Obsidian Kanban boards as their lanes and cards, and ticks cards; the boards stay Markdown notes"
run = ["python3", "main.py"]
# It reads the board's lanes and cards as items and ticks cards with items/edit: the board is a
# note, which Markdown reads and writes, so it needs no file permission.
permissions = ["items.read", "items.edit"]

# Obsidian's Kanban plugin marks a board with kanban-plugin in its frontmatter: basic, or
# board in its newer versions. Opening such a note shows it here instead of the reader.
[[shows]]
title = "Kanban board"
where.property = { kanban-plugin = "basic" }

[[shows]]
title = "Kanban board"
where.property = { kanban-plugin = "board" }
